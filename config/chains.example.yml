        url: "https://opt-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
      - name: infura-opt
        url: "https://optimism-mainnet.infura.io/v3/${INFURA_KEY}"
      - name: quicknode-opt
        url: "https://example.quiknode.pro/${QUICKNODE_KEY}"

  - name: base
    chainId: 8453
    nativeToken: ETH
    enabled: true
    rpcEndpoints:
      - name: alchemy-base
        url: "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
      - name: infura-base
        url: "https://base-mainnet.infura.io/v3/${INFURA_KEY}"
      - name: quicknode-base
        url: "https://example.quiknode.pro/${QUICKNODE_KEY}"

  - name: polygon
    chainId: 137
    nativeToken: POL
    enabled: true
    rpcEndpoints:
      - name: alchemy-poly
        url: "https://polygon-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"
      - name: infura-poly
        url: "https://polygon-mainnet.infura.io/v3/${INFURA_KEY}"
