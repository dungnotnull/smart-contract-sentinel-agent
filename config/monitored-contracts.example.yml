# SmartSentinel — Monitored Contracts Allowlist
# Copy this file to monitored-contracts.yml and add contracts to defend.
# WARNING: Only add contracts after human review. Agents MUST NOT self-modify this file.

contracts:
  - name: "Aave V3 Pool"
    chain: ethereum
    address: "0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2"
    pauseMethod: "setPoolPause(bool)"
    guardianAddress: "0x0000000000000000000000000000000000000000"  # Replace with real guardian multisig
    guardianPrivateKeyEnv: "AAVE_GUARDIAN_KEY"  # Environment variable name (never the actual key)
    tvlUsd: 5000000000
    drainThresholdPct: 3.0
    gnnThreshold: 0.80
    notify:
      telegramChatId: "-1000000000000"       # Replace with real Telegram chat ID
      pagerdutyServiceKeyEnv: "PD_AAVE_KEY"  # Environment variable name
    addedBy: human-review
    addedAt: "2026-05-31"

