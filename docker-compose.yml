version: "3.8"

services:
  sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-sentinel
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ALCHEMY_KEY=${ALCHEMY_KEY}
      - INFURA_KEY=${INFURA_KEY}
      - QUICKNODE_KEY=${QUICKNODE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - PAGERDUTY_SERVICE_KEY=${PD_SERVICE_KEY}
      - AUTO_PAUSE_ENABLED=${AUTO_PAUSE_ENABLED:-false}
      - DRY_RUN=${DRY_RUN:-true}
      - GNN_SERVER_URL=http://gnn-server:8765
      - ETH_RPC_URL=https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./models:/app/models:ro
    depends_on:
      - gnn-server

  gnn-server:
    build:
      context: ./ml-pipeline
      dockerfile: Dockerfile
    container_name: smart-sentinel-gnn
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - MODEL_PATH=/app/models/gnn-vuln-classifier
    volumes:
      - ./models:/app/models:ro

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: smart-sentinel-anvil
    restart: unless-stopped
    ports:
      - "8545:8545"
    entrypoint: ["anvil", "--fork-url", "${ETH_RPC_URL:-https://eth-mainnet.g.alchemy.com/v2/demo}", "--host", "0.0.0.0", "--port", "8545"]